name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Handy-Oberfläche: Werft, Aufträge, Zurück-Taste, keine abgeschnittenen Texte (390 und 360 px)
      - run: npm run e2e
